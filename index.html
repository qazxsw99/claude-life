<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vince 旅遊計畫日曆 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .legend {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-color {
            width: 30px;
            height: 30px;
            border-radius: 5px;
            border: 2px solid #ddd;
        }

        .calendars {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .calendar {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .calendar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #eee;
            padding: 1px;
            background-color: #f5f5f5;
        }

        .weekday {
            background: #f5f5f5;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #667eea;
            font-size: 0.9em;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: #eee;
            padding: 1px;
        }

        .day {
            background: white;
            padding: 15px;
            min-height: 100px;
            position: relative;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .day:hover {
            background: #f0f0f0;
        }

        .day-number {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 5px;
        }

        .day.other-month .day-number {
            color: #ccc;
        }

        .day-label {
            font-size: 0.75em;
            color: #666;
            line-height: 1.2;
            word-wrap: break-word;
            overflow: hidden;
            max-height: 70px;
        }

        /* 旅遊日期 */
        .day.shanghai {
            background: linear-gradient(135deg, #FFE5CC 0%, #FFCC99 100%);
            border: 2px solid #FF8C00;
        }

        .day.hanoi {
            background: linear-gradient(135deg, #CCE5FF 0%, #99CCFF 100%);
            border: 2px solid #0066FF;
        }

        /* 日本節日 */
        .day.japan-holiday {
            background: linear-gradient(135deg, #FFE5E5 0%, #FFCCCC 100%);
            border: 2px solid #FF4444;
        }

        .day.japan-holiday .day-label {
            color: #C41E3A;
            font-weight: bold;
        }

        /* 重疊情況 */
        .day.shanghai.japan-holiday {
            background: linear-gradient(135deg, #FFD4B3 0%, #FFB380 100%);
            border: 3px solid #FF6600;
        }

        .day.hanoi.japan-holiday {
            background: linear-gradient(135deg, #D4E5FF 0%, #B3D9FF 100%);
            border: 3px solid #0066CC;
        }

        .legend-shanghai {
            background: linear-gradient(135deg, #FFE5CC 0%, #FFCC99 100%);
            border: 2px solid #FF8C00;
        }

        .legend-hanoi {
            background: linear-gradient(135deg, #CCE5FF 0%, #99CCFF 100%);
            border: 2px solid #0066FF;
        }

        .legend-holiday {
            background: linear-gradient(135deg, #FFE5E5 0%, #FFCCCC 100%);
            border: 2px solid #FF4444;
        }

        .footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 0.9em;
        }

        .trip-summary {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .trip-summary h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .trip-item {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .calendars {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .legend {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .day {
                min-height: 80px;
                padding: 10px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Vince 旅遊計畫日曆 2026</h1>
        <p class="subtitle">規劃行程，避開日本節日</p>

        <div class="trip-summary">
            <h2>📅 已規劃的旅遊</h2>
            <div class="trip-item">
                🇨🇳 <strong>上海</strong> - 2026年7月3日～7月11日
            </div>
            <div class="trip-item">
                🇻🇳 <strong>峴港</strong> - 2026年8月4日～8月8日
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color legend-shanghai"></div>
                <span>上海行程 (7/3-7/11)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color legend-hanoi"></div>
                <span>峴港行程 (8/4-8/8)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color legend-holiday"></div>
                <span>日本節日 (避開)</span>
            </div>
        </div>

        <div class="calendars">
            <div class="calendar">
                <div class="calendar-header">2026年 7月</div>
                <div class="weekdays">
                    <div class="weekday">日</div>
                    <div class="weekday">一</div>
                    <div class="weekday">二</div>
                    <div class="weekday">三</div>
                    <div class="weekday">四</div>
                    <div class="weekday">五</div>
                    <div class="weekday">六</div>
                </div>
                <div class="days" id="july"></div>
            </div>

            <div class="calendar">
                <div class="calendar-header">2026年 8月</div>
                <div class="weekdays">
                    <div class="weekday">日</div>
                    <div class="weekday">一</div>
                    <div class="weekday">二</div>
                    <div class="weekday">三</div>
                    <div class="weekday">四</div>
                    <div class="weekday">五</div>
                    <div class="weekday">六</div>
                </div>
                <div class="days" id="august"></div>
            </div>

            <div class="calendar">
                <div class="calendar-header">2026年 9月</div>
                <div class="weekdays">
                    <div class="weekday">日</div>
                    <div class="weekday">一</div>
                    <div class="weekday">二</div>
                    <div class="weekday">三</div>
                    <div class="weekday">四</div>
                    <div class="weekday">五</div>
                    <div class="weekday">六</div>
                </div>
                <div class="days" id="september"></div>
            </div>
        </div>

        <div class="footer">
            <p>Created for Vince's Travel Planning | 建立於 2026年5月</p>
        </div>
    </div>

    <script>
        // 日本節日定義
        const japanHolidays = {
            '2026-07-20': '海之日',
            '2026-08-13': '盂蘭盆節',
            '2026-08-14': '盂蘭盆節',
            '2026-08-15': '盂蘭盆節',
            '2026-08-16': '盂蘭盆節',
            '2026-09-21': '敬老日',
            '2026-09-22': '秋分'
        };

        // 旅遊日期範圍
        const trips = [
            {
                start: new Date(2026, 6, 3),  // July 3
                end: new Date(2026, 6, 11),   // July 11
                name: '上海',
                className: 'shanghai'
            },
            {
                start: new Date(2026, 7, 4),  // Aug 4
                end: new Date(2026, 7, 8),    // Aug 8
                name: '峴港',
                className: 'hanoi'
            }
        ];

        function generateCalendar(month, year, containerId) {
            const container = document.getElementById(containerId);
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDate = new Date(firstDay);
            startDate.setDate(startDate.getDate() - firstDay.getDay());

            let currentDate = new Date(startDate);

            for (let i = 0; i < 42; i++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'day';

                if (currentDate.getMonth() !== month) {
                    dayElement.classList.add('other-month');
                }

                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = currentDate.getDate();
                dayElement.appendChild(dayNumber);

                const dateStr = currentDate.toISOString().split('T')[0];

                // 檢查是否是旅遊日期
                let tripName = null;
                for (const trip of trips) {
                    if (currentDate >= trip.start && currentDate <= trip.end) {
                        dayElement.classList.add(trip.className);
                        tripName = trip.name;
                        break;
                    }
                }

                // 檢查是否是日本節日
                const label = document.createElement('div');
                label.className = 'day-label';

                if (japanHolidays[dateStr]) {
                    dayElement.classList.add('japan-holiday');
                    label.textContent = japanHolidays[dateStr];
                } else if (tripName) {
                    label.textContent = tripName;
                }

                if (label.textContent) {
                    dayElement.appendChild(label);
                }

                container.appendChild(dayElement);
                currentDate.setDate(currentDate.getDate() + 1);
            }
        }

        // 生成日曆
        generateCalendar(6, 2026, 'july');     // July (month 6)
        generateCalendar(7, 2026, 'august');   // August (month 7)
        generateCalendar(8, 2026, 'september'); // September (month 8)
    </script>
</body>
</html>
